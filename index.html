function alerts(){let a=[],resolutions=db.alertResolutions||[];db.safety.forEach(s=>{let v=veh(s.vehicleId),d=dateDiff(s.expiry);if(!v||v.retiredAt)return;if(d<=30){let key='safety:'+s.id+':'+s.expiry,r=resolutions.find(x=>x.key===key);a.push({id:s.id,key,v,vehicleId:v.id,issue:s.name,deadline:s.expiry,d,kind:'safety',priority:d<0?'Expirate':d<=7?'Critice':'În curând',resolved:!!r,resolvedAt:r?.resolvedAt})}});db.parts.forEach(p=>{let v=veh(p.vehicleId);if(!v||v.retiredAt||p.requiresBaseline||Number(p.interval)<=0||!['km','ore','date'].includes(p.criterion))return;let q=partSchedule(p,v);if(!q.known)return;let d=q.due;if(d<=q.threshold){let key='part:'+p.id+':'+q.target,r=resolutions.find(x=>x.key===key);a.push({id:p.id,key,v,vehicleId:v.id,issue:`Revizie: ${p.name}`,deadline:p.criterion==='date'?'la '+q.target:'la '+q.target,d,kind:'part',priority:d<=0?'Expirate':'În curând',resolved:!!r,resolvedAt:r?.resolvedAt})}});resolutions.forEach(r=>{if(!a.some(x=>x.key===r.key)){let v=veh(r.vehicleId);if(v&&!v.retiredAt)a.push({...r,v,resolved:true})}});let open=db.alerts.filter(x=>x.status!=='Rezolvată');return `<section class="page"><div class="heading"><div><h1>Alerte</h1><p>Conformitate, revizii și intervenții care necesită atenție</p></div><span class="badge bad">${a.filter(x=>!x.resolved).length+open.length} active</span></div>${stats()}<div class="filters">${['Toate','Critice','Expirate','În curând','Rezolvate'].map(f=>`<button class="${alertFilter===f?'sel':''}" onclick="alertFilter='${f}';render()">${f}</button>`).join('')}</div><div class="section-title"><h2>Prioritate operațională</h2></div>${a.filter(x=>alertFilter==='Rezolvate'?x.resolved:!x.resolved&&(alertFilter==='Toate'||x.priority===alertFilter)).sort((x,y)=>x.d-y.d).map(x=>`<article class="alert ${x.d<0||x.d<=7?'critical':''}"><div class="row"><div><h3>${esc(x.v.name)} · ${esc(x.v.internal)}</h3><span class="muted">${esc(x.issue)} · termen: ${esc(x.deadline)}</span></div>${x.resolved?badge('Rezolvată'):badge(x.priority)}</div><div class="toolbar"><button onclick="openVehicle('${x.v.id}','${x.kind==='part'?'parts':'safety'}')">Deschide fișa</button><button onclick="historyForm('${x.v.id}','${x.issue}')">Înregistrează intervenție</button><button class="good" ${x.resolved?'disabled':''} onclick="resolveAlert('${x.id}','${x.kind}')">${x.resolved?'✓ Rezolvată':'✓ Marchează soluționată'}</button></div></article>`).join('')||'<div class="panel empty">Nu există alerte în această categorie.</div>'}<div class="section-title"><h2>Intervenții în curs · comenzi de piese</h2></div>${db.orders.filter(o=>!['Soluționată','Anulată'].includes(o.status)&&veh(o.vehicleId)&&!veh(o.vehicleId).retiredAt).map(o=>`<div class="panel">${orderCard(o)}</div>`).join('')||'<div class="panel empty">Nu sunt intervenții în curs.</div>'}<div class="section-title"><h2>Alerte personalizate</h2><button onclick="customAlertForm()">＋ Alertă</button></div>${open.map(x=>`<div class="alert"><h3>${esc(x.title)}</h3><div class="muted">${esc(x.detail)} · ${x.date}</div><button onclick="resolveAlert('${x.id}','custom')">Marchează soluționată</button></div>`).join('')}</section>`}

function reportDateKey(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function reportDateRange(){let now=new Date(),todayKey=reportDateKey(now),range=db.settings.reportRange||'today',from=db.settings.reportFrom||todayKey,to=db.settings.reportTo||todayKey;if(range==='7days'){let d=new Date(now);d.setDate(d.getDate()-6);from=reportDateKey(d);to=todayKey}else if(range==='month'){from=todayKey.slice(0,8)+'01';to=todayKey}else if(range==='today'){from=todayKey;to=todayKey}return {from,to,label:from===to?from:from+' — '+to}}

function appearanceSettings(){let a=db.settings.appearance||{};const slider=(key,title,description,min,max,step)=>`<div class="appearance-control"><div class="section-title"><label for="appearance-${key}">${title}</label><output id="appearance-${key}-value">${Number(a[key]||100)}%</output></div><input id="appearance-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${Number(a[key]||100)}" oninput="updateAppearance('${key}',this.value)" onchange="notify('Aspectul a fost actualizat.')"><div class="range-labels"><span>${min}%</span><span>${description}</span><span>${max}%</span></div></div>`;return `<section class="page settings-page"><div class="heading"><div><h1>Setări</h1><p>Aspect și instalare FleetOS</p></div></div><div class="panel"><div class="section-title"><div><h2>Aspectul aplicației</h2><p class="muted">Glisați pentru a ajusta fiecare dimensiune. Setările se salvează automat și se aplică imediat în toate secțiunile.</p></div></div>${slider('text','Mărimea textului','Text mai mic sau mai mare',40,250,5)}${slider('cards','Mărimea ferestrelor și cardurilor','Spațiere și dimensiuni',40,250,5)}${slider('buttons','Mărimea butoanelor','Dimensiunea țintelor tactile',40,250,5)}<button type="button" onclick="resetAppearance()">Restabilește valorile implicite · 100%</button></div><div id="fleetPwaPanel">${window.FleetPwa?.panelHtml?.()||''}</div>${window.FleetCloud?.panelHtml?.()||''}<div class="panel"><h2>Configurări operaționale</h2><p class="muted">Alertele și raportul zilnic se configurează în Server operațional.</p><div class="toolbar"><button onclick="openServerSection('server-alerts-config')">Configurare alerte șoferi</button><button onclick="openServerSection('server-report-config')">Configurare raport contabilitate</button><button onclick="openServerSection('server-address-config')">Adresă sediu și livrări</button></div></div></section>`}function openServerSection(id){go('server');setTimeout(()=>document.querySelector('#'+id)?.scrollIntoView({behavior:'smooth',block:'start'}),50)}function updateAppearance(key,value){let a=db.settings.appearance=db.settings.appearance||{text:100,cards:100,buttons:100},limits={text:[40,250],cards:[40,250],buttons:[40,250]},range=limits[key],number=Number(value);if(!range||!Number.isFinite(number))return;a[key]=Math.max(range[0],Math.min(range[1],number));save();applyAppearance();let output=document.querySelector('#appearance-'+key+'-value');if(output)output.textContent=a[key]+'%'}function resetAppearance(){db.settings.appearance={text:100,cards:100,buttons:100};save();render();notify('Setările de aspect au fost restabilite la 100%.')}function applyAppearance(){let a=db.settings.appearance||{},textScale=(Number(a.text)||100)/100,cardScale=(Number(a.cards)||100)/100,buttonScale=(Number(a.buttons)||100)/100;document.documentElement.style.setProperty('--card-scale',String(cardScale));document.documentElement.style.setProperty('--button-scale',String(buttonScale));const nodes=document.querySelectorAll('#app *,#desktopnav *,#mobilebar *,#overlay *'),pending=[];for(const el of nodes){if(!el.dataset||!el.style||['SCRIPT','STYLE'].includes(el.tagName))continue;let base=Number(el.dataset.appearanceBaseFont);if(!Number.isFinite(base)||base<=0){base=parseFloat(getComputedStyle(el).fontSize);if(!Number.isFinite(base)||base<=0)continue;el.dataset.appearanceBaseFont=String(base)}pending.push([el,base])}for(const [el,base] of pending)el.style.fontSize=`${base*textScale}px`}function render(){nav();app.innerHTML=page==='fleet'?fleet():page==='profile'?profile():page==='alerts'?alerts():page==='settings'?appearanceSettings():server();save();applyAppearance()}async function exportFleetBackup(){try{let backup=window.FleetCloud?await window.FleetCloud.fullBackup():{format:'fleetos-backup',version:2,exportedAt:new Date().toISOString(),state:db,documents:[]};db.settings.lastBackupAt=new Date().toISOString();applyingCloudState=true;localStorage.setItem(KEY,JSON.stringify(db));applyingCloudState=false;backup.state=db;downloadText('fleetos-backup-'+today()+'.json',JSON.stringify(backup));if(page==='settings')render();notify(window.FleetCloud?'Backup complet generat, inclusiv documentele atașate.':'Backupul datelor aplicației a fost generat; fișierele atașate necesită pornirea prin server FleetOS.')}catch(error){applyingCloudState=false;notify('Nu am putut genera backupul complet: '+error.message)}}async function importFleetBackup(input){let file=input.files?.[0];if(!file)return;try{let imported=JSON.parse(await file.text()),isV2=imported?.format==='fleetos-backup',restored=isV2?imported.state:imported;if(!restored||!Array.isArray(restored.vehicles)||!Array.isArray(restored.history)||!Array.isArray(restored.orders)||!restored.settings){notify('Fișierul nu pare să fie un backup FleetOS valid.');return}if(!confirm('Importul va înlocui datele FleetOS din acest browser. Se va descărca mai întâi backupul curent. Continuați?'))return;await exportFleetBackup();db=restored;db.vehicles.forEach(v=>{v.activeCounter=v.activeCounter||(v.unit==='ore'?'ore':'km');v.meters=v.meters||{km:v.unit==='km'?Number(v.usage)||0:0,ore:v.unit==='ore'?Number(v.usage)||0:0};v.meters.km=Number(v.meters.km)||0;v.meters.ore=Number(v.meters.ore)||0;v.usage=v.meters[v.activeCounter];v.unit=v.activeCounter});db.settings.vehicleSchema=db.settings.vehicleSchema||{labels:{},categoryOptions:['Autoturism','Transport','Utilaj'],statusOptions:['Operațional','În revizie','Indisponibil']};if(isV2){await vehicleDocStore('readwrite','clear');for(const item of imported.documents||[]){let binary=atob(item.dataBase64||''),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);await vehicleDocStore('readwrite','put',{...item,blob:new Blob([bytes],{type:item.type||'application/octet-stream'})})}}save();render();notify('Backupul FleetOS a fost importat'+(isV2?' împreună cu documentele.':'.'))}catch(error){notify('Nu am putut importa backupul: '+error.message)}finally{ if(!title||!reportTitle||columns.some(c=>!c.title||!Number.isInteger(c.order)||c.order<0)||new Set(columns.map(c=>c.order)).size!==columns.length){notify('Completați denumirile și folosiți poziții de ordine distincte pentru cele patru coloane.');return false}
if(!document.querySelector('#includeOrders').checked&&!document.querySelector('#includeHistory').checked){notify('Selectați cel puțin o sursă: comenzi sau istoric service.');return false}
if(range==='custom'&&(!from||!to||from>to)){notify('Intervalul personalizat necesită date valide, iar data de început trebuie să fie înaintea datei de sfârșit.');return false}
const time=document.querySelector('#reportTime').value;if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(time)){notify('Selectați o oră validă pentru raport.');return false}
s.reportSectionTitle=title;s.reportTitle=reportTitle;s.reportRange=range;s.reportFrom=from;s.reportTo=to;s.reportVehicleId=document.querySelector('#reportVehicleId').value;s.reportCategory=document.querySelector('#reportCategory').value;s.reportStatusFilter=document.querySelector('#reportStatusFilter').value.trim();s.reportOperationFilter=document.querySelector('#reportOperationFilter').value.trim();s.reportTime=time;s.reportFormat=document.querySelector('#reportFormat').value;s.reportRecipient=document.querySelector('#reportRecipient').value.trim();s.intro=document.querySelector('#intro').value;s.includeOrders=document.querySelector('#includeOrders').checked;s.includeHistory=document.querySelector('#includeHistory').checked;s.reportColumns=columns;save();render();notify('Structura, filtrele și destinatarii raportului au fost salvați.');return true}
function isQuickConsumableRecord(entry){if(entry?.reportSource==='quick-consumable')return true;const description=String(entry?.description||'');return Number(entry?.quantity)>0&&!!entry?.quantityUnit&&/^(Înlocuire consumabil|Completare fluid|Schimb fluid|Remediere defecțiune minoră):/.test(description)}function dailyData(){
const period=reportDateRange(),settings=db.settings,rows=[],matches=date=>String(date||'').slice(0,10)>=period.from&&String(date||'').slice(0,10)<=period.to,accept=row=>(!settings.reportVehicleId||row.vehicleId===settings.reportVehicleId)&&(!settings.reportCategory||row.category===settings.reportCategory)&&(!settings.reportStatusFilter||String(row.status||'').toLowerCase().includes(settings.reportStatusFilter.toLowerCase()))&&(!settings.reportOperationFilter||String(row.operation||'').toLowerCase().includes(settings.reportOperationFilter.toLowerCase()));
if(settings.includeOrders)db.orders.filter(o=>matches(o.date)&&o.supplier&&o.status!=='Așteaptă oferte'&&o.status!=='Anulată').forEach(o=>{const v=veh(o.vehicleId);if(!v)return;const items=(o.items||[]).map(i=>i.name+(i.model?' · '+i.model:'')+' × '+(i.qty||1)).join('; '),quantities=(o.items||[]).map(i=>String(i.qty||1)).join('; '),row={date:o.date,vehicle:v.name+(v.internal?' · '+v.internal:''),category:v.category,operation:'Comandă piese',supplier:o.supplier+(o.phone?' · '+o.phone:''),items,quantity:quantities,description:o.defect||'',status:o.status||'',cost:o.cost!=null?String(o.cost)+' '+(o.currency||'RON'):'',user:o.user||'',custom:(v.customSections||[]).flatMap(s=>s.fields||[]).filter(f=>f.value).map(f=>s.title+' · '+f.label+': '+f.value).join('; '),vehicleId:v.id,_sortDate:String(o.date||'')};if(accept(row))rows.push(row)});
db.history.filter(x=>matches(x.date)&&!(settings.includeOrders&&x.type==='Comandă piese')&&(settings.includeHistory||isQuickConsumableRecord(x))).forEach(x=>{const v=veh(x.vehicleId);if(!v)return;const row={date:new Date(x.date).toLocaleString('ro-RO'),vehicle:v.name,category:v.category,operation:x.type||'',supplier:x.supplier||'',items:x.parts||'',quantity:x.quantity||'',description:x.description||'',status:x.status||'',cost:x.cost!=null?String(x.cost)+' '+(x.currency||'RON'):'',user:x.user||'',custom:(v.customSections||[]).flatMap(s=>s.fields||[]).filter(f=>f.value).map(f=>s.title+' · '+f.label+': '+f.value).join('; '),vehicleId:v.id,_sortDate:String(x.date||'')};if(accept(row))rows.push(row)});
return rows.sort((a,b)=>a._sortDate.localeCompare(b._sortDate))}
function previewDaily(){if(!saveReportSettings())return;let rows=dailyData(),range=reportDateRange();modal('Previzualizare raport zilnic',`<p class="muted">Perioada: ${esc(range.label)} · Înregistrări: ${rows.length}</p>${db.settings.intro?`<p>${esc(db.settings.intro)}</p>`:''}${reportTableHtml(rows)}<p class="muted">Ing. Lehaci Vasile</p>`,()=>closeModal(),'Închide')}
function dailyReportName(){let d=new Date(),date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return (db.settings.reportTitle||'Raport contabilitate FleetOS')+' - '+date}
function dailyReportText(){let rows=dailyData(),columns=reportColumns().filter(c=>c.enabled);if(!rows.length)return '';const cell=x=>String(x??'').replace(/[\r\n]+/g,' ').replace(/\|/g,'\\|'),line=values=>'| '+values.map(cell).join(' | ')+' |',table=[line(columns.map(c=>c.title)),line(columns.map(()=> '---')),...rows.map(r=>line(columns.map(c=>reportColumnValue(r,c.key))))].join('\n');return `${db.settings.reportTitle||'Raport contabilitate FleetOS'}\nPerioada: ${reportDateRange().label}\n${db.settings.intro?db.settings.intro+'\n\n':''}${table}\n\nIng. Lehaci Vasile`}function sendDaily(){if(!saveReportSettings())return;let text=dailyReportText();if(!text){notify('Nu există înregistrări pentru raportul selectat.');return}if(db.settings.reportFormat==='PDF')downloadPdf(dailyReportName(),text);else downloadText(dailyReportName().toLowerCase().replaceAll(' ','-')+'.txt',text)}function sendDailyWhatsApp(){if(!saveReportSettings())return;let phone=(db.settings.reportRecipient||'').trim();if(!phone){notify('Introduceți și salvați numărul WhatsApp al destinatarului.');document.querySelector('#reportRecipient')?.focus();return}let text=dailyReportText();if(!text){notify('Nu există înregistrări care corespund setărilor raportului de astăzi.');return}let digits=phone.replace(/\D/g,'');if(digits.startsWith('0'))digits='40'+digits.slice(1);if(digits.length<8){notify('Numărul destinatarului pare incomplet. Folosiți format internațional, de exemplu +40...');return}if(db.settings.reportFormat==='PDF'){downloadPdf(dailyReportName(),text);text=`${db.settings.intro||'Bună ziua,'}\n\nRaportul zilnic FleetOS a fost generat în PDF și descărcat. Atașați fișierul PDF în această conversație WhatsApp pentru a-l transmite.\n\nIng. Lehaci Vasile`}let opened=window.open(`https://wa.me/${digits}?text=${encodeURIComponent(text)}`,'_blank');if(opened){opened.opener=null;notify(db.settings.reportFormat==='PDF'?'PDF-ul a fost generat. WhatsApp a fost deschis cu mesajul pregătit; atașați PDF-ul și apăsați Trimitere.':'WhatsApp a fost deschis cu raportul pregătit. Verificați destinatarul și apăsați Trimitere.')}else notify('Raportul nu a fost trimis: browserul a blocat fereastra WhatsApp. Permiteți pop-up-urile și reîncercați.')}
function downloadText(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href);notify('Fișierul text a fost generat.')}
function downloadPdf(title,text){const clean=value=>String(value).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[–—]/g,'-').replace(/[×]/g,'x').replace(/[^\x20-\x7E]/g,'?');const wrap=line=>{let rest=clean(line),out=[];while(rest.length>92){let cut=rest.lastIndexOf(' ',92);if(cut<45)cut=92;out.push(rest.slice(0,cut));rest=rest.slice(cut).trimStart()}out.push(rest);return out};const lines=[clean(title),'',...String(text).split(/\r?\n/)].flatMap(wrap),pages=[];for(let i=0;i<lines.length;i+=50)pages.push(lines.slice(i,i+50));if(!pages.length)pages.push(['']);const escape=value=>clean(value).replace(/[()\\]/g,'\\$&'),objects=[];objects.push('<< /Type /Catalog /Pages 2 0 R >>');const pageRefs=pages.map((_,i)=>`${4+i*2} 0 R`).join(' ');objects.push(`<< /Type /Pages /Kids [${pageRefs}] /Count ${pages.length} >>`);objects.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');pages.forEach((page,i)=>{const pageRef=4+i*2,contentRef=pageRef+1,commands=page.map((line,j)=>`${j===0?'':`0 -15 Td `}(${escape(line)}) Tj`).join(' '),stream=`BT /F1 9 Tf 40 800 Td ${commands} ET`;objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentRef} 0 R >>`);objects.push(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`)});let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));a.download=title.toLowerCase().replaceAll(' ','-')+'.pdf';a.click();URL.revokeObjectURL(a.href);notify('Raport PDF generat.')}function exportService(id){let v=veh(id),hs=db.history.filter(h=>h.vehicleId===id).sort((a,b)=>a.date.localeCompare(b.date)),text=`RAPORT SERVICE — ${v.name} (${v.internal})\n\n${hs.map(h=>`${new Date(h.date).toLocaleString('ro-RO')} | ${h.type} | ${h.description} | Furnizor: ${h.supplier||'—'} | Piese: ${h.parts||'—'} | ${h.status}`).join('\n')||'Nu există operațiuni în istoric.'}\n\nIng. Lehaci Vasile`;downloadPdf(`Raport service ${v.internal}`,text)}function exportTop(kind){let text='TOP INTERVENȚII FLOTĂ\n'+db.vehicles.map(v=>`${v.name} (${v.internal}): ${db.history.filter(h=>h.vehicleId===v.id).length} intervenții`).sort().join('\n')+'\n\nIng. Lehaci Vasile';kind==='pdf'?downloadPdf('Top interventii flota',text):downloadText('top-interventii.txt',text)}
window.FleetPwaReady=()=>render();window.FleetCloudReady=()=>{if(window.FleetCloud)window.FleetCloud.init({getState:()=>db,hasLocalSnapshot:()=>hadLocalSnapshot,notify,render,setRevision:r=>{cloudRevision=Number(r);db.settings.cloudRevision=cloudRevision;try{sessionStorage.setItem('fleetosCloudRevision',String(cloudRevision))}catch{}applyingCloudState=true;localStorage.setItem(KEY,JSON.stringify(db));applyingCloudState=false},enableCloud:r=>{db.settings.cloudSyncEnabled=true;db.settings.cloudRevision=Number(r);cloudRevision=Number(r);try{sessionStorage.setItem('fleetosCloudRevision',String(cloudRevision))}catch{}applyingCloudState=true;localStorage.setItem(KEY,JSON.stringify(db));applyingCloudState=false},applyRemote:(state,r)=>{applyingCloudState=true;db=state;db.settings=db.settings||{};db.settings.cloudSyncEnabled=true;db.settings.cloudRevision=Number(r);cloudRevision=Number(r);try{sessionStorage.setItem('fleetosCloudRevision',String(cloudRevision))}catch{}localStorage.setItem(KEY,JSON.stringify(db));applyingCloudState=false},downloadFullBackup:async()=>{const backup=await window.FleetCloud.fullBackup();downloadText('fleetos-backup-inainte-de-sincronizare-'+today()+'.json',JSON.stringify(backup))}});render()};installFleetBackGuard();render();
