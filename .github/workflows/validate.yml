name: Validate FleetOS

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-and-js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring, pdo_mysql
      - name: Check PHP syntax
        run: |
          php -l api/bootstrap.php
          php -l api/index.php
          php -l router.php
          php -l scripts/import-local-backup.php
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check auth.js
          node --check cloud-sync.js
          node --check pwa.js
          python3 -c "import re; h=open('index.html',encoding='utf-8').read(); s=re.search(r'<script>([\s\S]*?)</script>',h); assert s, 'inline app script not found'; open('/tmp/fleetos-inline.js','w',encoding='utf-8').write(s.group(1))"
          node --check /tmp/fleetos-inline.js
      - name: Test cloud synchronization decisions
        run: node --test tests/cloud-sync.test.cjs

  deploy-production:
    name: Deploy to cPanel over FTPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: php-and-js-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fleetos-production-deploy
      cancel-in-progress: false
    steps:
      - name: Check deployment secrets
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          if [ -z "$CPANEL_FTP_SERVER" ] || [ -z "$CPANEL_FTP_USERNAME" ] || [ -z "$CPANEL_FTP_PASSWORD" ]; then
            echo "::error::Set CPANEL_FTP_SERVER, CPANEL_FTP_USERNAME and CPANEL_FTP_PASSWORD in GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy FleetOS to the cPanel document root
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.CPANEL_FTP_PORT || '21' }}
          server-dir: ${{ vars.CPANEL_FTP_SERVER_DIR || './' }}
          security: strict
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            .env
            .env.*
            **/uploads/**
            **/backups/**
            FleetOS-cPanel.zip
