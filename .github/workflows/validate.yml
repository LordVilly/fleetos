name: Validate FleetOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-and-js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring, pdo_mysql
      - name: Check PHP syntax
        run: |
          php -l api/bootstrap.php
          php -l api/index.php
          php -l router.php
          php -l scripts/import-local-backup.php
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check auth.js
          node --check cloud-sync.js
          node --check pwa.js
          python3 -c "import re; h=open('index.html',encoding='utf-8').read(); s=re.search(r'<script>([\s\S]*?)</script>',h); assert s, 'inline app script not found'; open('/tmp/fleetos-inline.js','w',encoding='utf-8').write(s.group(1))"
          node --check /tmp/fleetos-inline.js
